<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- GRADED REC.709 CINEMATIC LOOK (Rich contrast, teal & orange, deep blacks) -->
  <defs>
    <linearGradient id="gradeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131a"/>
      <stop offset="45%" stop-color="#09202c"/>
      <stop offset="100%" stop-color="#02080d"/>
    </linearGradient>
    <radialGradient id="gradeLight" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05131a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealShadows" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gradeBg)"/>
  <rect width="800" height="450" fill="url(#gradeLight)"/>
  <rect width="800" height="450" fill="url(#tealShadows)"/>

  <!-- Graded Portrait / Subject with warm golden rim light & rich silhouette -->
  <circle cx="450" cy="200" r="80" fill="#18110b" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.9"/>
  <path d="M360 300 C360 300 340 370 340 450 L560 450 C560 370 540 300 540 300 Z" fill="#0c1119" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Graded background architectural elements with saturated lighting -->
  <rect x="50" y="80" width="180" height="260" rx="10" fill="#081a24" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="50" y1="160" x2="230" y2="160" stroke="#06b6d4" stroke-width="2.5"/>
  <circle cx="140" cy="230" r="30" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2"/>

  <!-- Graded Scope Watermark -->
  <rect x="24" y="24" width="165" height="28" rx="6" fill="rgba(8,12,18,0.9)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b" font-weight="700">AFTER: REC.709 GRADE</text>

  <rect x="630" y="24" width="146" height="28" rx="6" fill="rgba(8,12,18,0.9)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="642" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="700">TEAL &amp; GOLD CURVE</text>

  <!-- Bottom Stamp -->
  <rect x="24" y="380" width="350" height="46" rx="8" fill="rgba(8,12,18,0.92)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <text x="40" y="402" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fbbf24" font-weight="700">After: DaVinci Resolve Master Grade</text>
  <text x="40" y="418" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">DEEP FILM BLACKS • WARM SKIN ROLL-OFF</text>
</svg>

