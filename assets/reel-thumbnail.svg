<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="100%" height="100%">
  <defs>
    <linearGradient id="reelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="35%" stop-color="#190e28"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <radialGradient id="reelBeatGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="450" height="800" fill="url(#reelBg)"/>
  <rect width="450" height="800" fill="url(#reelBeatGlow)"/>

  <!-- Vertical 9:16 framing lines -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#f43f5e" stroke-width="2"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#f43f5e" stroke-width="2"/>
  <line x1="430" y1="20" x2="390" y2="20" stroke="#f43f5e" stroke-width="2"/>
  <line x1="430" y1="20" x2="430" y2="60" stroke="#f43f5e" stroke-width="2"/>

  <!-- Audio Waveform in Center -->
  <g opacity="0.85">
    <line x1="60" y1="400" x2="60" y2="420" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="380" x2="80" y2="440" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="350" x2="100" y2="470" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="320" x2="120" y2="500" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="370" x2="140" y2="450" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="390" x2="160" y2="430" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="310" x2="180" y2="510" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="200" y2="540" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <line x1="225" y1="250" x2="225" y2="570" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="290" x2="250" y2="530" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <line x1="270" y1="330" x2="270" y2="490" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    <line x1="290" y1="360" x2="290" y2="460" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="300" x2="310" y2="520" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="340" x2="330" y2="480" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="370" x2="350" y2="450" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="370" y1="390" x2="370" y2="430" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="390" y1="400" x2="390" y2="420" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Big Central Play Badge -->
  <circle cx="225" cy="410" r="38" fill="rgba(15,23,42,0.85)" stroke="#f43f5e" stroke-width="2"/>
  <polygon points="219,396 239,410 219,424" fill="#f43f5e"/>

  <!-- Top Tags -->
  <rect x="24" y="28" width="94" height="26" rx="6" fill="rgba(10,12,18,0.85)" stroke="#f43f5e" stroke-width="1"/>
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e" font-weight="700">9:16 REEL</text>

  <rect x="320" y="28" width="106" height="26" rx="6" fill="rgba(10,12,18,0.85)" stroke="#38bdf8" stroke-width="1"/>
  <text x="330" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="700">30 SECONDS</text>

  <!-- Dynamic Typography Overlay -->
  <rect x="30" y="620" width="390" height="130" rx="12" fill="rgba(15,20,30,0.88)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="50" y="656" font-family="'Syne', sans-serif" font-size="20" fill="#ffffff" font-weight="800">HIGH-RETENTION CUT</text>
  <text x="50" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Beat match cuts &amp; sound design</text>
  <text x="50" y="722" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ec4899" font-weight="600">OPTIMIZED FOR IG REELS &amp; SHORTS</text>
</svg>

