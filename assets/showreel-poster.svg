<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="40%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <radialGradient id="stageGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rimLight" cx="62%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Scanlines / Grid pattern -->
    <pattern id="filmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#filmGrid)"/>
  <rect width="1280" height="720" fill="url(#stageGlow)"/>

  <!-- Stage Lights & Atmosphere Beams -->
  <polygon points="200,0 350,0 520,540 120,540" fill="url(#beamGrad)" opacity="0.4" />
  <polygon points="1080,0 930,0 760,540 1160,540" fill="url(#beamGrad)" opacity="0.35" />
  <polygon points="640,0 700,0 800,600 550,600" fill="url(#rimLight)" opacity="0.5" />

  <!-- Stage Platform -->
  <path d="M0 550 L1280 550 L1280 720 L0 720 Z" fill="#08090d"/>
  <line x1="0" y1="550" x2="1280" y2="550" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Band Member Silhouettes: Drummer (Center Back) -->
  <circle cx="640" cy="360" r="32" fill="#030406"/>
  <rect x="620" y="392" width="40" height="65" rx="10" fill="#030406"/>
  <!-- Drum Cymbals & Kit -->
  <ellipse cx="560" cy="410" rx="45" ry="10" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="720" cy="400" rx="48" ry="11" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="640" cy="460" rx="60" ry="18" fill="#151922" stroke="#06b6d4" stroke-width="2"/>
  <!-- Drumsticks -->
  <line x1="620" y1="390" x2="565" y2="408" stroke="#fff" stroke-width="3" opacity="0.8"/>
  <line x1="660" y1="390" x2="715" y2="398" stroke="#fff" stroke-width="3" opacity="0.8"/>

  <!-- Bassist Silhouette (Left) -->
  <circle cx="410" cy="310" r="34" fill="#05070a"/>
  <path d="M380 344 C380 344 370 420 375 550 L445 550 C450 420 440 344 440 344 Z" fill="#05070a"/>
  <!-- Bass Guitar -->
  <path d="M350 480 L490 320" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="360" cy="470" rx="35" ry="24" transform="rotate(-35 360 470)" fill="#0e7490" stroke="#38bdf8" stroke-width="2"/>

  <!-- Lead Vocalist / Guitarist (Foreground Right/Center) -->
  <circle cx="780" cy="270" r="42" fill="#020304"/>
  <!-- Hair / Silhouette contour with Rim Light -->
  <path d="M740 270 A42 42 0 0 1 822 270" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.9" filter="url(#cinematicGlow)"/>
  <path d="M730 312 C730 312 710 400 720 560 L850 560 C860 400 840 312 840 312 Z" fill="#020304"/>
  <!-- Electric Guitar Body -->
  <path d="M710 440 L880 330" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="730" cy="430" rx="42" ry="26" transform="rotate(-28 730 430)" fill="#b45309" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Mic Stand -->
  <line x1="790" y1="290" x2="790" y2="550" stroke="#71717a" stroke-width="3"/>
  <circle cx="790" cy="290" r="9" fill="#a1a1aa"/>

  <!-- Cinematic Framing Letterbox Bars (16:9 Scope Guides) -->
  <rect x="0" y="0" width="1280" height="42" fill="#000000" fill-opacity="0.9"/>
  <rect x="0" y="678" width="1280" height="42" fill="#000000" fill-opacity="0.9"/>

  <!-- Center Crosshair & Viewfinder Metadata -->
  <line x1="640" y1="340" x2="640" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="620" y1="360" x2="660" y2="360" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Viewfinder UI Overlay -->
  <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#10b981" font-weight="600">● REC [PRORES 422 HQ]</text>
  <text x="640" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a1a1aa" text-anchor="middle">STC 01:00:24:18</text>
  <text x="1240" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f59e0b" text-anchor="end" font-weight="600">DAVINCI RESOLVE GRADE</text>

  <!-- Big Central Play Badge Indicator -->
  <circle cx="640" cy="360" r="56" fill="rgba(10,12,18,0.75)" stroke="#f59e0b" stroke-width="2" filter="url(#cinematicGlow)"/>
  <polygon points="632,342 660,360 632,378" fill="#f59e0b"/>

  <text x="640" y="704" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">
    NIMIT PANCHAL — SHOWREEL 2026 • 24 FPS • DAVINCI RESOLVE MASTER
  </text>
</svg>

