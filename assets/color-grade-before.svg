<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- FLAT LOG / RAW SIMULATION (Un-graded, lifted blacks, muted colors) -->
  <defs>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4c52"/>
      <stop offset="50%" stop-color="#555861"/>
      <stop offset="100%" stop-color="#3d4047"/>
    </linearGradient>
    <radialGradient id="logLight" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7e7b75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a4c52" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#logGrad)"/>
  <rect width="800" height="450" fill="url(#logLight)"/>

  <!-- Washed out portrait / subject -->
  <circle cx="450" cy="200" r="80" fill="#6d6b67"/>
  <path d="M360 300 C360 300 340 370 340 450 L560 450 C560 370 540 300 540 300 Z" fill="#58595f"/>

  <!-- Washed out background elements -->
  <rect x="50" y="80" width="180" height="260" rx="10" fill="#4f525a" stroke="#60636c" stroke-width="2"/>
  <line x1="50" y1="160" x2="230" y2="160" stroke="#60636c" stroke-width="2"/>
  <circle cx="140" cy="230" r="30" fill="#5c5f69"/>

  <!-- Log Scope Watermark -->
  <rect x="24" y="24" width="140" height="28" rx="6" fill="rgba(60,62,70,0.85)" stroke="#808491" stroke-width="1"/>
  <text x="36" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" font-weight="600">LOG / UNGRADED</text>

  <rect x="630" y="24" width="146" height="28" rx="6" fill="rgba(60,62,70,0.85)" stroke="#808491" stroke-width="1"/>
  <text x="642" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" font-weight="600">CAMERA RAW PROFILE</text>

  <!-- Bottom Stamp -->
  <rect x="24" y="380" width="310" height="46" rx="8" fill="rgba(50,52,60,0.8)" stroke="#717582" stroke-width="1"/>
  <text x="40" y="402" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#e2e8f0" font-weight="700">Before: Flat Dynamic Range</text>
  <text x="40" y="418" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">LIFTED SHADOWS • DESATURATED</text>
</svg>

